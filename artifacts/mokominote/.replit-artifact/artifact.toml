kind = "web"
previewPath = "/"
title = "MoKominoté"
description = "A Mauritius-focused local business directory and community platform where people discover trusted businesses, join their communities, and engage with local offers, events, and announcements."
version = "1.0.0"
id = "artifacts/mokominote"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21454

[services.development]
run = "pnpm --filter @workspace/mokominote run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mokominote", "run", "build" ]
serve = "static"
publicDir = "artifacts/mokominote/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21454"
BASE_PATH = "/"
